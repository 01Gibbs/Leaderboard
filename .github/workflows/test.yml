# Runs the grader's tests whenever the grading code, lessons or workflows change.
# This is the only place the container check is tested end to end, because it needs Docker.
name: Test the grader

on:
  push:
    paths: ['grader/**', 'lessons.json', '.github/workflows/**', 'walkthrough/**', 'walkthrough.py', 'index.html']
  pull_request:
    paths: ['grader/**', 'lessons.json', '.github/workflows/**', 'walkthrough/**', 'walkthrough.py', 'index.html']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            25
            21
      - name: Create the sandbox user the grader runs submissions as
        run: sudo useradd --create-home --shell /bin/bash grader-sandbox
      - name: Run the tests (check tests run submissions as the sandbox user, like the real grader)
        env:
          GRADER_SANDBOX_USER: grader-sandbox
          GRADER_CACHE: /tmp/grader-cache  # readable by the sandbox user
        run: python3 -m unittest discover -v grader/tests
