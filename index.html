<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Java Exercise Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: one ranked list. Summary and rubric above it, auto-generated recognition below it. */
:root {
  color-scheme: light dark;
  --bg: #f5f6f3;
  --surface: #ffffff;
  --fg: #1a2420;
  --muted: #5b6862;
  --line: #dde2dc;
  --accent: #3a4bc0;
  --accent-soft: #e8ebfb;
  --ok: #1b7448;
  --ok-bg: #e0f3e8;
  --part: #8a5608;
  --part-bg: #fbeed3;
  --none: #8b958f;
  --danger: #b3261e;
  --display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --body: "Inter", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111715; --surface: #19211e; --fg: #e5ebe7; --muted: #94a29a; --line: #29332e;
    --accent: #99a6ff; --accent-soft: #232a52;
    --ok: #62d59d; --ok-bg: #15321f; --part: #e8b659; --part-bg: #33270f;
    --none: #77837c; --danger: #ff8a80;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--body); font-size: 15px; line-height: 1.5;
  padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1060px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
h1, h2 { font-family: var(--display); margin: 0; text-wrap: balance; }
h1 { font-size: clamp(26px, 4vw, 36px); line-height: 1.1; letter-spacing: -0.01em; }
h2 { font-size: 18px; }
.sub { color: var(--muted); margin: 6px 0 0; max-width: 62ch; }
.top { display: flex; flex-wrap: wrap; gap: 18px 40px; align-items: flex-end; justify-content: space-between; }
.stats { display: flex; gap: 28px; flex-wrap: wrap; }
.stat b { display: block; font-family: var(--display); font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.stat.ok b { color: var(--ok); }

.rubric { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); border-block: 1px solid var(--line); padding-block: 10px; }
.rubric b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }

.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.bar input[type=search] { flex: 1 1 200px; min-width: 0; }
input, textarea, select, button { font: inherit; color: var(--fg); }
input[type=search] { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
button { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.board { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow-x: auto; }
.row {
  display: grid; align-items: center; gap: 8px 12px; padding: 12px 16px; border-top: 1px solid var(--line);
  grid-template-columns: 2.6rem minmax(9rem, 1.7fr) repeat(var(--tracks, 4), minmax(5.2rem, 1fr)) 4rem 4rem 4rem 4.6rem;
  min-width: calc(34rem + var(--tracks, 4) * 6rem); /* past about five exercises the board scrolls sideways instead of clipping */
}
.row.head { border-top: 0; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); background: var(--bg); padding-block: 9px; }
.row.full { box-shadow: inset 4px 0 0 var(--ok); }
.rank { font-family: var(--display); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; color: var(--muted); }
.rank.top3 { color: var(--accent); }
.name { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.name small { display: inline-block; margin-left: 6px; font-size: 11px; font-weight: 600; color: var(--ok); background: var(--ok-bg); border-radius: 999px; padding: 1px 8px; vertical-align: 2px; }
.num { font-variant-numeric: tabular-nums; text-align: right; color: var(--muted); }
.pts { font-family: var(--display); font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; text-align: right; }
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.chip.correct { background: var(--ok-bg); color: var(--ok); }
.chip.submitted { background: var(--part-bg); color: var(--part); }
.chip.submitted::before { background: transparent; box-shadow: inset 0 0 0 2px currentColor; }
.chip.none { color: var(--none); font-weight: 500; }
.chip.none::before { background: transparent; box-shadow: inset 0 0 0 1.5px currentColor; opacity: .6; }
.cell::before { content: attr(data-label); display: none; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 2px; }

.empty { padding: 36px 20px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--fg); font-family: var(--display); font-size: 18px; margin-bottom: 4px; }

.reco { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.reco section { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.reco h3 { margin: 0 0 6px; font-family: var(--display); font-size: 15px; }
.reco p { margin: 0 0 8px; font-size: 12.5px; color: var(--muted); }
.reco ul { margin: 0; padding-left: 18px; }
.reco li { overflow-wrap: anywhere; }
.note { font-size: 13px; color: var(--muted); }
.note.err { color: var(--danger); }
.foot { font-size: 12.5px; color: var(--muted); }

@media (max-width: 860px) {
  .row {
    grid-template-columns: 2.4rem 1fr 1fr 1fr;
    grid-template-areas: "rank name name pts" ". tr tr ." ". xs xs xs";
    min-width: 0;
    padding: 12px;
  }
  .row.head { display: none; }
  .row .rank { grid-area: rank; }
  .row .name { grid-area: name; }
  .row .pts { grid-area: pts; }
  .row .tracks { grid-area: tr; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
  .row .xs { grid-area: xs; display: flex; gap: 16px; font-size: 13px; color: var(--muted); }
  .row .xs .num { text-align: left; }
  .cell::before { display: block; }
  .row > .cell { min-width: 0; }
}
@media (min-width: 861px) { .row .xs, .row .tracks { display: contents; } .lbl { display: none; } }
@media (prefers-reduced-motion: no-preference) { .row, button { transition: background .15s, border-color .15s; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Java Exercise Leaderboard</h1>
      <p class="sub" id="sub">Effort and correct solutions across the workshop exercises.</p>
    </div>
    <div class="stats" aria-label="Summary" data-tour="stats">
      <div class="stat"><b id="sPeople">0</b><span>Participants</span></div>
      <div class="stat"><b id="sSub">0</b><span>Submissions</span></div>
      <div class="stat ok"><b id="sOk">0</b><span>Correct solutions</span></div>
    </div>
  </header>

  <div class="rubric" aria-label="How points work" data-tour="rubric">
    <span>Submitted <b>10</b></span>
    <span>Correct solution <b>30</b></span>
    <span>Each stretch task <b>+5</b></span>
    <span>Each time helping a colleague <b>+5</b></span>
    <span>Bonus points from facilitators</span>
  </div>

  <div class="bar" data-tour="tools">
    <input type="search" id="q" placeholder="Find a participant" aria-label="Find a participant">
    <button id="onlyOk" aria-pressed="false">Correct solutions only</button>
    <button id="copy">Copy as text</button>
  </div>

  <div id="msg" class="note" role="status" hidden></div>
  <div id="picker" class="bar" hidden>
    <label for="csvFile">Choose participants.csv:</label>
    <input type="file" id="csvFile" accept=".csv,text/csv">
  </div>
  <div class="board" id="board" aria-label="Leaderboard" data-tour="board"></div>

  <section id="recoWrap" hidden data-tour="recognition">
    <h2 style="margin-bottom:12px">Recognition</h2>
    <div class="reco" id="reco"></div>
  </section>

  <p class="foot" id="updated" hidden></p>
  <noscript><p class="note err">This leaderboard needs JavaScript to load the scores.</p></noscript>
</div>

<script>
// Scores live in participants.csv next to this page; the exercises are listed in lessons.json.
const DATA_FILE = 'participants.csv';
const LESSONS_FILE = 'lessons.json';
// Columns that are not exercises. Every other column is shown as an exercise when lessons.json cannot be read.
const BASE_COLUMNS = ['name', 'github', 'stretch', 'helped', 'bonus'];
let TRACKS = [];
const STATUS = { none: 'Not submitted', submitted: 'Submitted', correct: 'Correct' };
const PTS = { none: 0, submitted: 10, correct: 30, stretch: 5, helped: 5, bonus: 1 };

let rows = [], loaded = false, query = '', onlyOk = false, skipped = 0;
const $ = (id) => document.getElementById(id);

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function say(text, isErr) {
  const m = $('msg');
  if (!text) { m.hidden = true; return; }
  m.textContent = text; m.className = 'note' + (isErr ? ' err' : ''); m.hidden = false;
}

/* ---- CSV parsing (quotes, commas inside quotes, CRLF, BOM) ---- */
function parseCSV(text) {
  text = text.replace(/^﻿/, '');
  // Excel in some regions saves CSV with ";" or tabs, so use whichever the header row uses most.
  const first = text.split(/\r?\n/)[0] || '';
  const n = (ch) => first.split(ch).length - 1;
  const delim = [',', ';', '\t'].sort((a, b) => n(b) - n(a))[0];
  const out = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === delim) { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(cur); cur = ''; out.push(row); row = [];
    } else cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); out.push(row); }
  return out.filter((r) => r.some((v) => v.trim() !== ''));
}
function normStatus(v) {
  const s = String(v || '').trim().toLowerCase();
  if (['correct', 'passed', 'pass', 'yes', 'y', 'done'].includes(s)) return 'correct';
  if (['submitted', 'partial', 'attempted', 'in review'].includes(s)) return 'submitted';
  return 'none';
}
function toCount(v) { const n = parseInt(String(v || '').trim(), 10); return Number.isFinite(n) && n > 0 ? n : 0; }
function toInt(v) { const n = parseInt(String(v || '').trim(), 10); return Number.isFinite(n) ? n : 0; }
function titleCase(k) { const s = k.replace(/_/g, ' '); return s.charAt(0).toUpperCase() + s.slice(1); }
function toParticipants(table) {
  if (!table.length) return [];
  const head = table[0].map((h) => h.trim().toLowerCase().replace(/[\s-]+/g, '_'));
  const idx = (k) => head.indexOf(k);
  if (!TRACKS.length) TRACKS = head.filter((h) => h && !BASE_COLUMNS.includes(h)).map((k) => ({ k, label: titleCase(k) }));
  const out = []; skipped = 0;
  for (const r of table.slice(1)) {
    const name = (r[idx('name')] || '').trim().slice(0, 80);
    if (!name) { skipped++; continue; }
    const p = { name, tracks: {}, stretch: toCount(r[idx('stretch')]), helped: toCount(r[idx('helped')]), bonus: toInt(r[idx('bonus')]) };
    TRACKS.forEach((t) => { p.tracks[t.k] = normStatus(r[idx(t.k)]); });
    out.push(p);
  }
  return out;
}

/* ---- scoring ---- */
function trackOf(p, k) { return p.tracks[k] || 'none'; }
function pointsOf(p) {
  let t = 0;
  for (const tr of TRACKS) t += PTS[trackOf(p, tr.k)] || 0;
  return t + p.stretch * PTS.stretch + p.helped * PTS.helped + p.bonus * PTS.bonus;
}
function countState(p, s) { return TRACKS.filter((t) => trackOf(p, t.k) === s).length; }
function ranked() {
  const list = rows.map((p) => ({ p, pts: pointsOf(p) }));
  list.sort((a, b) => b.pts - a.pts || a.p.name.localeCompare(b.p.name));
  let prev = null, rank = 0;
  list.forEach((r, i) => { if (r.pts !== prev) { rank = i + 1; prev = r.pts; } r.rank = rank; });
  return list;
}

/* ---- rendering ---- */
function render() {
  const list = ranked();
  $('sPeople').textContent = list.length;
  $('sSub').textContent = list.reduce((a, r) => a + TRACKS.filter((t) => trackOf(r.p, t.k) !== 'none').length, 0);
  $('sOk').textContent = list.reduce((a, r) => a + countState(r.p, 'correct'), 0);

  const board = $('board'); board.replaceChildren();
  board.style.setProperty('--tracks', TRACKS.length);
  if (!loaded) { board.append(el('div', 'empty', 'Loading the leaderboard…')); return; }
  if (!list.length) {
    const e = el('div', 'empty');
    e.append(el('b', '', 'No participants yet'), el('span', '', 'The board fills in once scores are added to participants.csv.'));
    board.append(e); $('recoWrap').hidden = true; return;
  }

  const head = el('div', 'row head'); head.dataset.tour = 'columns';
  head.append(el('div', '', '#'), el('div', '', 'Participant'));
  TRACKS.forEach((t) => head.append(el('div', '', t.label)));
  head.append(el('div', 'num', 'Stretch'), el('div', 'num', 'Helped'), el('div', 'num', 'Bonus'), el('div', 'num', 'Points'));
  board.append(head);

  const q = query.trim().toLowerCase();
  let shown = 0;
  for (const r of list) {
    const p = r.p;
    if (q && !p.name.toLowerCase().includes(q)) continue;
    if (onlyOk && countState(p, 'correct') === 0) continue;
    shown++;
    const full = countState(p, 'correct') === TRACKS.length;
    const row = el('div', 'row' + (full ? ' full' : ''));
    const example = shown === 1; // the walkthrough points at the first row as an example
    if (example) row.dataset.tour = 'first-row';
    row.append(el('div', 'rank' + (r.rank <= 3 ? ' top3' : ''), String(r.rank)));
    const nm = el('div', 'name', p.name);
    if (full) nm.append(el('small', '', 'All correct'));
    row.append(nm);
    const tracks = el('div', 'tracks'); if (example) tracks.dataset.tour = 'first-row-results';
    TRACKS.forEach((t) => {
      const c = el('div', 'cell'); c.dataset.label = t.label;
      const st = trackOf(p, t.k);
      const ch = el('span', 'chip ' + st, st === 'none' ? 'Not yet' : STATUS[st]);
      ch.setAttribute('aria-label', t.label + ': ' + STATUS[st]);
      c.append(ch); tracks.append(c);
    });
    row.append(tracks);
    const xs = el('div', 'xs'); if (example) xs.dataset.tour = 'first-row-extras';
    const sc = el('div', 'num'), hc = el('div', 'num'), bc = el('div', 'num');
    sc.append(el('span', 'lbl', 'Stretch '), document.createTextNode(String(p.stretch)));
    hc.append(el('span', 'lbl', 'Helped '), document.createTextNode(String(p.helped)));
    bc.append(el('span', 'lbl', 'Bonus '), document.createTextNode(String(p.bonus)));
    xs.append(sc, hc, bc); row.append(xs);
    row.append(el('div', 'pts', String(r.pts)));
    board.append(row);
  }
  if (!shown) board.append(el('div', 'empty', 'No one matches this filter.'));
  renderReco(list);
}

function namesOf(arr) { return arr.map((r) => r.p.name); }
function renderReco(list) {
  const box = $('reco'); box.replaceChildren();
  const groups = [];
  const allOk = list.filter((r) => countState(r.p, 'correct') === TRACKS.length);
  if (allOk.length) groups.push(['Correct on every exercise', 'Submitted a correct solution to every exercise.', namesOf(allOk)]);
  TRACKS.forEach((t) => {
    const ok = list.filter((r) => trackOf(r.p, t.k) === 'correct');
    if (ok.length) groups.push(['Correct: ' + t.label, ok.length + ' correct solution' + (ok.length === 1 ? '' : 's') + '.', namesOf(ok)]);
  });
  const maxS = Math.max(0, ...list.map((r) => r.p.stretch));
  if (maxS > 0) groups.push(['Went beyond the brief', maxS + ' stretch task' + (maxS === 1 ? '' : 's') + ' completed.', namesOf(list.filter((r) => r.p.stretch === maxS))]);
  const maxH = Math.max(0, ...list.map((r) => r.p.helped));
  if (maxH > 0) groups.push(['Helped colleagues most', 'Helped a colleague ' + maxH + ' time' + (maxH === 1 ? '' : 's') + '.', namesOf(list.filter((r) => r.p.helped === maxH))]);
  const tried = list.filter((r) => TRACKS.every((t) => trackOf(r.p, t.k) !== 'none'));
  if (tried.length) groups.push(['Attempted every exercise', 'Submitted something for every exercise.', namesOf(tried)]);

  $('recoWrap').hidden = groups.length === 0;
  for (const [title, desc, names] of groups) {
    const s = el('section'); s.append(el('h3', '', title), el('p', '', desc));
    const ul = el('ul'); names.slice(0, 50).forEach((n) => ul.append(el('li', '', n))); s.append(ul); box.append(s);
  }
}

$('q').addEventListener('input', (e) => { query = e.target.value; render(); });
$('onlyOk').addEventListener('click', (e) => { onlyOk = !onlyOk; e.currentTarget.setAttribute('aria-pressed', String(onlyOk)); render(); });
$('copy').addEventListener('click', async () => {
  const text = ranked().map((r) => r.rank + '. ' + r.p.name + ' - ' + r.pts + ' pts (' +
    TRACKS.map((t) => t.label + ': ' + STATUS[trackOf(r.p, t.k)]).join(', ') + ')').join('\n');
  try { await navigator.clipboard.writeText(text); say('Leaderboard copied.'); setTimeout(() => say(''), 2500); }
  catch (e) { const ta = el('textarea'); ta.value = text; ta.style.width = '100%'; $('msg').after(ta); ta.select(); say('Select the text below and copy it.'); }
});

function describeLessons() {
  const names = TRACKS.map((t) => t.label);
  const list = names.length > 1 ? names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1] : names.join('');
  $('sub').textContent = 'Effort and correct solutions across the ' + (list || 'workshop') + ' exercises.';
}

(async function start() {
  render();
  try {
    const res = await fetch(LESSONS_FILE, { cache: 'no-cache' });
    if (res.ok) TRACKS = (await res.json()).map((l) => ({ k: l.key, label: l.label }));
  } catch (e) { /* opened from disk: exercises come from the CSV columns instead */ }
  try {
    const res = await fetch(DATA_FILE, { cache: 'no-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    rows = toParticipants(parseCSV(await res.text()));
    const lm = res.headers.get('last-modified');
    if (lm && !isNaN(Date.parse(lm))) {
      const u = $('updated'); u.textContent = 'Scores last updated ' + new Date(lm).toLocaleString(); u.hidden = false;
    }
    if (skipped) say(skipped + ' row' + (skipped === 1 ? '' : 's') + ' in participants.csv had no name and were skipped.', true);
  } catch (e) {
    say('The scores file could not be loaded automatically (' + e.message + '). This happens when the page is opened straight from disk. Choose participants.csv below to view it, or run start.bat to open it through a local server.', true);
    $('picker').hidden = false;
  }
  loaded = true; describeLessons(); render();
})();

// Fallback for pages opened from disk: read the CSV the viewer picks.
$('csvFile').addEventListener('change', async (e) => {
  const f = e.target.files[0]; if (!f) return;
  rows = toParticipants(parseCSV(await f.text()));
  describeLessons();
  say('Loaded ' + rows.length + ' participant' + (rows.length === 1 ? '' : 's') + ' from ' + f.name + '.' +
    (skipped ? ' ' + skipped + ' row' + (skipped === 1 ? '' : 's') + ' had no name and were skipped.' : ''), skipped > 0);
  e.target.value = ''; // lets the same file be chosen again after you edit it
  render();
});
</script>
</body>
</html>
